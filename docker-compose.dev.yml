services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avn_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-avn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avn} -d ${POSTGRES_DB:-avn_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      # migrations live at internal/database/migrations in dev but server reads /app/migrations
      - ./backend/internal/database/migrations:/app/migrations
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-avn}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-avn_tracker}?sslmode=disable
      PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - API_URL=http://api:8080
    depends_on:
      - api
volumes:
  postgres_data: